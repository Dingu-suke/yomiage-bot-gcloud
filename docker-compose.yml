services:
  bot:
    build: .
    container_name: yomiage-bot
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
    volumes:
      - ./gcp-key.json:/app/gcp-key.json:ro
    # ホスト再起動後も自動復帰する（手動で stop したときだけ起動しない）
    restart: unless-stopped
    # ラズパイの SD カードをログで埋めないよう上限を設ける
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
